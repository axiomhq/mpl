[package]
name = "mpl-language-server"
version = "0.6.0"
edition = "2024"
authors = ["Seoyoung Lee <seoyoung@axiom.co>", "Arne Bahlo <arne@axiom.co>", "Heinz Gies <heinz@axiom.co>", "Samuel Cristobal <samu@messy.page>"]
description = "Language services for MPL: completions, diagnostics, tokenization, lints, hover"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiomhq/mpl"
rust-version = "1.92.0"

[lib]

[[bin]]
name = "mpl-lsp"
path = "src/bin/mpl-lsp.rs"
required-features = ["lsp-bin"]

[dependencies]
mpl-lang = { path = "../..", default-features = false }
lsp-server = { version = "0.7.9", optional = true }
lsp-types = { version = "0.97.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
rowan = "0.17"
strsim = "0.11.1"
miette = { version = "7.6.0", features = ["serde"] }
eyre = { version = "0.6", optional = true }

[features]
default = []
examples = ["mpl-lang/examples"]
lsp-bin = ["dep:eyre", "dep:lsp-server", "dep:lsp-types", "dep:serde_json"]

[dev-dependencies]
test-case = "3"
regex = "1"
